services:
  postgres:
    image: postgres:17
    container_name: arquitecto-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: arquitecto
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - arquitecto-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d arquitecto']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  arquitecto-pgdata:
