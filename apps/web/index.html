<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply the stored or system theme before first paint to avoid a flash.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('arquitecto-theme');
        } catch (e) {}
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = stored === 'light' || stored === 'dark' ? stored : dark ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <title>Arquitecto · AWS SAA-C03</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
