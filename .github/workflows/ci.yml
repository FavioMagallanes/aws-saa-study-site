name: CI

# Manual only while the GitHub account budget for Actions blocks every job. To run it on every
# push and pull request again, replace workflow_dispatch with:
#   push:
#     branches: [main]
#   pull_request:
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arquitecto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arquitecto"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/arquitecto_test
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Build shared contracts
        run: pnpm --filter @arquitecto/contracts build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test contracts
        run: pnpm --filter @arquitecto/contracts test

      - name: Test API
        run: pnpm --filter @arquitecto/api test

      - name: Test web
        run: pnpm --filter @arquitecto/web test

      - name: Build web
        run: pnpm --filter @arquitecto/web build
